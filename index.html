*{box-sizing:border-box}body{margin:0;background:#f3f3f3;font-family:system-ui,"Noto Sans JP",sans-serif;color:#222}.app{max-width:1100px;margin:auto;padding:15px}h1{font-size:22px;margin:0 0 5px}.sub{font-size:13px;color:#666;margin-bottom:12px}.grid{display:grid;grid-template-columns:minmax(340px,560px) 1fr;gap:14px}.card{background:#fff;border-radius:14px;padding:13px;box-shadow:0 2px 12px #0001}.map{position:relative;aspect-ratio:347/648}.map img,.map canvas{position:absolute;inset:0;width:100%;height:100%}.map img{object-fit:contain}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}button{border:0;border-radius:9px;padding:8px 12px;background:#222;color:#fff;cursor:pointer}button.alt{background:#e8e8e8;color:#222}input{width:100%}.clock{font-size:25px;font-weight:800}.row{display:grid;grid-template-columns:14px 58px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #eee;font-size:13px}.dot{width:11px;height:11px;border-radius:50%}.box{background:#f7f7f7;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;line-height:1.6}@media(max-width:800px){.grid{grid-template-columns:1fr}}

html,body{width:100%;min-height:100%;overflow-x:hidden}
body{-webkit-text-size-adjust:100%;touch-action:manipulation}
.app{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
          max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
}
.map{width:100%;min-width:0}
.map canvas{pointer-events:none}
button{
  min-height:44px;
  font-size:15px;
  -webkit-tap-highlight-color:transparent;
}
input[type="range"]{min-height:36px;touch-action:pan-x}
.card{min-width:0}
#overlapList{overflow-wrap:anywhere}
@media(max-width:800px){
  .app{padding:10px}
  h1{font-size:19px;line-height:1.35}
  .sub{font-size:12px;line-height:1.55}
  .grid{display:flex;flex-direction:column;gap:10px}
  .card{padding:10px;border-radius:12px}
  .map{aspect-ratio:347/648}
  .controls{gap:8px}
  .controls button{flex:1 1 auto}
  .clock{font-size:24px}
  .row{grid-template-columns:14px 52px minmax(0,1fr);font-size:12px}
  .box{font-size:12px;padding:9px}
}
@media(max-width:430px){
  .app{padding:8px}
  .card{padding:8px}
  .controls button{padding:9px 10px;font-size:14px}
  .map{max-height:none}
}
@media(orientation:landscape) and (max-height:520px){
  .map{max-height:78vh;width:auto;margin:0 auto}
}

function state(i,t){

function checkpointWindows(i){

function renderOverlaps(){
